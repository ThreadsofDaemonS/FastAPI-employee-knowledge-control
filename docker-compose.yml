version: "3.9"

services:
  db:
    image: postgres:15
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:5432"

  redis:
    image: redis:7
    restart: always
    ports:
      - "${REDIS_PORT}:6379"

  app:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "${HOST}", "--port", "${PORT}", "--reload"]
    volumes:
      - .:/code
    depends_on:
      - db
      - redis
    env_file:
      - .env
    ports:
      - "${PORT}:${PORT}"

volumes:
  postgres_data:
